name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest
        run: |
          pytest -v || [ $? -eq 5 ]

  build:
    name: Build and Push Docker Image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.username }}
          password: ${{ secrets.password }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.username }}/ai-powered-web-research-agent:latest
            ${{ secrets.username }}/ai-powered-web-research-agent:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            echo "Pulling latest Docker image..."

            docker pull ${{ secrets.username }}/ai-powered-web-research-agent:latest

            echo "Stopping old container..."

            docker rm -f ai-powered-web-research-agent 2>/dev/null || true

            echo "Starting new container..."

            ENV_FLAG=""
            if [ -f .env ]; then
              ENV_FLAG="--env-file .env"
            fi

            docker run -d \
              --name ai-powered-web-research-agent \
              --restart unless-stopped \
              ${ENV_FLAG} \
              -p 8000:8000 \
              ${{ secrets.username }}/ai-powered-web-research-agent:latest

            echo "Checking container..."

            sleep 5

            docker ps --filter "name=ai-powered-web-research-agent"

            echo "Cleaning old images..."

            docker image prune -f

            echo "Deployment completed!"
