name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Install Playwright Browsers & System Dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Flake8
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests/ -v --maxfail=1

  build:
    name: Build and Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.username || secrets.username }}
          password: ${{ secrets.password || secrets.password }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.username || secrets.username }}/ai-powered-web-research-agent:latest
            ${{ secrets.username || secrets.username }}/ai-powered-web-research-agent:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            DOCKER_USER="${{ secrets.username || secrets.username }}"
            IMAGE_NAME="${DOCKER_USER}/ai-powered-web-research-agent:latest"
            CONTAINER_NAME="ai-powered-web-research-agent"

            echo "Pulling latest Docker image: ${IMAGE_NAME}..."
            docker pull ${IMAGE_NAME}

            echo "Stopping old container (if running)..."
            docker rm -f ${CONTAINER_NAME} 2>/dev/null || true

            echo "Starting new container..."
            ENV_FLAG=""
            if [ -f .env ]; then
              ENV_FLAG="--env-file .env"
            fi

            docker run -d \
              --name ${CONTAINER_NAME} \
              --restart unless-stopped \
              ${ENV_FLAG} \
              -p 8000:8000 \
              ${IMAGE_NAME}

            echo "Verifying running container..."
            sleep 5
            docker ps --filter "name=${CONTAINER_NAME}"

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Deployment completed successfully!"